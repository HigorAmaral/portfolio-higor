<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentação da API | Higor Amaral</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body {
      margin: 0;
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .top-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 14px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar a:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }
    .swagger-container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .swagger-ui {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:1.15rem; font-weight:700; color:#ffffff;">Higor Amaral &bull; API Docs</span>
      <span style="background:rgba(56,189,248,0.2); color:#38bdf8; font-size:0.75rem; padding:3px 10px; border-radius:12px; font-weight:600;">OpenAPI 3.0.3</span>
    </div>
    <div>
      <a href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar ao Portfólio
      </a>
    </div>
  </header>
  <div class="swagger-container">
    <main id="swagger-ui" class="swagger-ui"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "/api/docs/schema.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
