services:
  - type: web
    name: portfolio-higor
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ADMIN_URL
        value: "painel-higor"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: HTTPS
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
