name: Deploy GitHub Pages (site estático)

# Modo híbrido: o front-end vai para o GitHub Pages e a API Django continua no Render.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Gerar site estático
        env:
          API_BASE: https://portfolio-higor.onrender.com
          # "/portfolio-higor" no endereço padrão do Pages; vazio se usar domínio próprio
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
