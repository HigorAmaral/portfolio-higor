name: Keep Render Alive

on:
  schedule:
    # Dispara a cada 15 minutos em minutos fora de pico (3, 18, 33, 48) para evitar congestionamento na fila do GitHub
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Portfolio Health Check on Render
        run: |
          echo "Enviando requisição de health check para https://portfolio-higor.onrender.com/healthz/..."
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -m 60 --retry 2 --retry-delay 5 https://portfolio-higor.onrender.com/healthz/)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          
          echo "Status retornado: $STATUS"
          echo "Resposta do backend: $BODY"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Portfólio online, banco de dados conectado e ativo!"
          else
            echo "Aviso: código de resposta HTTP $STATUS retornado pelo servidor."
            exit 1
          fi
