name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Princípio do menor privilégio: o workflow só pode LER o repositório
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-test-secret-key-super-secure-and-long-enough-for-django-security-check-2026
      DEBUG: "0"
      BEHIND_PROXY: "1"

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Integridade de Segurança (Deploy Check)
        run: |
          python manage.py check --deploy --fail-level WARNING

      - name: Auditar Dependências (vulnerabilidades conhecidas - CVEs)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Executar Testes Automatizados
        run: |
          python manage.py test --verbosity 2
